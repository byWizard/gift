<!doctype html>
<html lang="ru" data-style="business" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f151d">
<title>Хотелки — списки подарков без повторов</title>
<meta name="description" content="Собери список подарков, поделись ссылкой — друзья забронируют, и никто не подарит одно и то же дважды.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="bg-mesh"></div>
<canvas id="fx"></canvas>
<div class="grain"></div>

<header id="nav"></header>
<main id="app"></main>
<footer id="foot"></footer>
<nav id="tabbar"></nav>

<div id="modal-root"></div>
<div id="confirm-root"></div>
<div id="toasts"></div>
<canvas id="confetti"></canvas>

<div id="boot-error" style="display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;background:#2b1414;color:#ffe8e8;border:2px solid #e5484d;border-radius:14px;padding:16px;font:14px/1.5 system-ui,sans-serif;box-shadow:0 20px 50px rgba(0,0,0,.5)">
  <b style="font-size:16px">⚠️ Скрипт не запустился</b>
  <p style="margin:8px 0">Проверь, что рядом лежат все файлы: <b>style.css, theme.css, config.js, theme.js, auth.js, admin.js, script.js</b>.</p>
  <pre style="white-space:pre-wrap;background:#1c0d0d;padding:10px;border-radius:8px;font-size:12px;margin:0"></pre>
</div>

<script>
window.addEventListener('error', function (e) {
  var box = document.getElementById('boot-error');
  if (!box) return;
  box.style.display = 'block';
  box.querySelector('pre').textContent = (e.message || 'Ошибка') + '\n' + (e.filename || '') + ' : строка ' + (e.lineno || '?');
});
</script>
<script src="config.js" defer></script>
<script src="theme.js" defer></script>
<script src="auth.js" defer></script>
<script src="admin.js" defer></script>
<script src="script.js" defer onerror="document.getElementById('boot-error').style.display='block'"></script>
</body>
</html>
